# Waveter is a static site plus one edge function: /stream/:id relays http:// station
# streams (mixed content otherwise). Everything else is queried from the browser.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# The edge function declares its own route (`config.path` in netlify/edge-functions/stream.js).
